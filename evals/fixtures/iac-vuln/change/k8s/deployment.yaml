apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: acme/api:latest
          securityContext:
            privileged: true
          env:
            - name: DB_PASSWORD
              value: "SuperSecret123!"
