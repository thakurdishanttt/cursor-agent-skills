# Every push and PR: validate the marketplace, plugins and components against
# Cursor's formats, run the hook/installer/validator tests on Linux, macOS and
# Windows, and build the release zips.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - name: Package (reproducible)
        run: |
          python3 scripts/package.py
          cp dist/SHA256SUMS /tmp/first
          python3 scripts/package.py
          diff /tmp/first dist/SHA256SUMS
      - run: python3 scripts/run_evals.py --dry-run

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q -p no:cacheprovider tests/
