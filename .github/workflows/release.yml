# Push a tag like v1.0.0 to publish a GitHub Release with each plugin zip, each
# skill zip and SHA256SUMS. Only tags on main are released.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag must match the marketplace version
        run: |
          v="$(python3 -c 'import json;print(json.load(open(".cursor-plugin/marketplace.json"))["metadata"]["version"])')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != marketplace version v$v"; exit 1; }
      - run: python3 scripts/validate.py
      - run: python3 scripts/package.py
      - name: Release notes
        run: |
          {
            echo "Plugins:"
            for f in plugins/*/.cursor-plugin/plugin.json; do
              python3 -c 'import json,sys;m=json.load(open(sys.argv[1]));print(f"- `{m[\"name\"]}` {m[\"version\"]}")' "$f"
            done
            echo
            echo "Install from Cursor: Customize → Plugins → From GitHub Repository → thakurdishanttt/cursor-agent-skills."
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`. Changes: see CHANGELOG.md."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
